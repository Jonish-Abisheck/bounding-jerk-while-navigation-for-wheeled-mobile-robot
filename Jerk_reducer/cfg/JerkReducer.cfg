#!/usr/bin/env python
PACKAGE = "jerk_reducer"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("filter_frequency", double_t, 0, "Filter frequency", 20.0, 1.0, 200.0)
gen.add("velocity_timeout", double_t, 0, "Velocity timeout", 1.0, 0.0, 10.0)

gen.add("max_vel_x",     double_t, 0, "Max linear x velocity",   1.0,   0.0, 10.0)
gen.add("min_vel_x",     double_t, 0, "Min linear x velocity",  -1.0, -10.0,  0.0)
gen.add("max_vel_y",     double_t, 0, "Max linear y velocity",   0.0,   0.0, 10.0)
gen.add("min_vel_y",     double_t, 0, "Min linear y velocity",   0.0, -10.0, 10.0)
gen.add("max_vel_theta", double_t, 0, "Max angular z velocity",  3.5,   0.0, 20.0)
gen.add("min_vel_theta", double_t, 0, "Min angular z velocity", -3.5, -20.0,  0.0)

gen.add("max_accel_x",     double_t, 0, "Max linear x accel",   2.5,   0.0, 50.0)
gen.add("max_accel_y",     double_t, 0, "Max linear y accel",   0.0,   0.0, 50.0)
gen.add("max_accel_theta", double_t, 0, "Max angular z accel",  3.2,   0.0, 50.0)

gen.add("max_decel_x",     double_t, 0, "Max linear x decel",  -2.5, -50.0,  0.0)
gen.add("max_decel_y",     double_t, 0, "Max linear y decel",   0.0, -50.0,  0.0)
gen.add("max_decel_theta", double_t, 0, "Max angular z decel", -3.2, -50.0,  0.0)

gen.add("max_jerk_x",     double_t, 0, "Max tangential jerk",  10.0,  0.0, 200.0)
gen.add("max_jerk_y",     double_t, 0, "Max lateral jerk",      5.0,  0.0, 200.0)
gen.add("max_jerk_theta", double_t, 0, "Max angular jerk",     15.0,  0.0, 200.0)

exit(gen.generate(PACKAGE, "jerk_reducer", "JerkReducer"))